name: ✅ CI Checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    name: 🧪 Code, Tests & Security
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 🐍 Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: pip

      - name: 📥 Install dependencies and tools
        run: |
          pip install -r requirements.txt
          pip install black flake8 bandit

      - name: 🧹 Check Code Format (Black)
        run: black --check .

      - name: 🔍 Lint (Flake8)
        run: flake8 ip_monitor.py --max-line-length 100

      - name: 🔐 Security Scan (Bandit)
        run: bandit -r ip_monitor.py

      - name: 🧪 Unit tests
        run: python -m unittest -v

      - name: 🔍 Trivy filesystem scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          version: v0.70.0
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: 🐳 Build image
        run: docker build --tag ip-monitor:ci .

      - name: 🔍 Trivy image scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ip-monitor:ci
          version: v0.70.0
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'
