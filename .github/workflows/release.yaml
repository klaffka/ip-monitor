name: 🚀 Automated Release + Docker Build

on:
  push:
    branches: [main]

jobs:
  validate:
    name: 🧪 Validate release candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          pip install -r requirements.txt
          pip install black flake8 bandit
      - run: black --check .
      - run: flake8 ip_monitor.py --max-line-length 100
      - run: bandit -r ip_monitor.py
      - run: python -m unittest -v

  image-security:
    name: 🛡️ Build & scan release candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag ip-monitor:release-candidate .
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ip-monitor:release-candidate
          version: v0.70.0
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'

  release:
    name: 📝 Create Release + Tag
    needs: [validate, image-security]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@0dfd8538845b8e92600d271a895a5372865d4062 # v5
        id: release
        with:
          release-type: simple

  build-and-publish:
    name: 🐳 Build & Push Docker Image
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.version }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 🛠️ Build Docker image
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ip-watcher
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          docker build --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" .
      - name: 📤 Push Docker image
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ip-watcher
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
